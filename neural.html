</style></head><body><div id="view"></div><aside><h1>学习型三维重建试验</h1><p id="notice">照片贴附在预测的三维表面上。可恢复被过滤的连续表面；遮挡和未拍到的部分仍有缺失。<br><a href="/gaussian.html">查看实际训练后的高斯版本 →</a></p><label>照片组<select id="group"></select></label><label>显示范围<select id="surface"><option value="all">合并所有照片的预测表面</option></select></label><label>显示方式<select id="mode"><option value="surface">照片贴面</option><option value="points">彩色点云</option></select></label><label><input type="checkbox" id="recover" checked>恢复低置信度的连续表面</label><label><input type="checkbox" id="supported">只显示其他视角深度也支持的部分</label><p id="status">正在读取预测结果…</p><label>回到照片拍摄位置<select id="camera"></select></label><button id="overview">整体观察</button><p>拖动环顾 · 滚轮前后移动<br>右键平移 · WASD 移动<br>Q / E 升降</p><p id="error"></p><small>多视图深度相近只是检验线索，不等同于实测正确。模型没有绝对米制尺寸。</small><p><a href="/reconstruction.html">传统重建试验</a> · <a href="/">原院子模型</a></p></aside><script type="module" src="/src/neuralPreview.js"></script></body></html>
