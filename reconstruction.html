<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老照片 · 重建试验</title><style>
body{margin:0;background:#151b20;color:#e9edf0;font:14px system-ui}main{position:fixed;inset:0 0 0 370px}canvas{display:block}aside{position:fixed;top:20px;left:20px;width:300px;padding:20px;background:#172028ed;border:1px solid #53616b;border-radius:12px;max-height:85vh;overflow:auto}h1{font-size:20px;margin:0 0 12px}p{line-height:1.7;color:#bac8cf}select,button{background:#273740;color:white;border:1px solid #6b818c;border-radius:5px;padding:8px;max-width:100%;margin:4px 0}label{display:block;margin-top:12px}#status{white-space:pre-line;line-height:1.8}a{color:#91d2d6}small{color:#afbdc5}#error{color:#ffb5a8} @media(max-width:700px){main{inset:46vh 0 0}aside{box-sizing:border-box;width:calc(100% - 20px);height:43vh;max-height:none;font-size:12px;top:10px;left:10px}}</style></head><body><main id="view"></main><aside><h1>传统稀疏重建试验</h1><p><a href="/neural.html">打开新的学习型三维表面预览 →</a></p><p>本次最好结果只有 86 个稀疏点，没有房屋表面和地面。下方点图仅供检查计算结果，不能当作场景成品。</p><select id="models"></select><div id="status">读取结果…</div><label><input id="reliable" type="checkbox">只看至少 3 张照片支持的点</label><label>点大小 <input id="size" type="range" min="2" max="10" step="1" value="5"></label><label><input id="photoColor" type="checkbox">显示照片原色（默认青色方便看清）</label><button id="reset">聚焦点云</button><p>拖动旋转 · 滚轮缩放 · 右键平移<br>橙色框为恢复的拍摄位置</p><label>核对照片中的重建点<select id="photo"></select></label><div id="evidence" style="position:relative;width:100%;margin:8px 0"></div><small>彩色标记是实际参与三维重建的照片位置。空白区域不代表已恢复。</small><div id="error"></div><a href="/">返回院子模型</a></aside><script type="module" src="/src/sfmPreview.js"></script></body></html>
